name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Dotnet build
        run: dotnet build src/M365Toolbox.Desktop/M365Toolbox.Desktop.csproj

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester tests/M365Toolbox.PowerShell.Tests.ps1 -Output Detailed
