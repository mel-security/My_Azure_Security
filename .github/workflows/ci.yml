name: CI

on:
  push:
  pull_request:

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build WPF desktop
        run: dotnet build src/M365Toolbox.Desktop/M365Toolbox.Desktop.csproj -c Release

  test-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-PSResource Pester -TrustRepository -Scope CurrentUser -Quiet
          Import-Module Pester
          Invoke-Pester tests/M365Toolbox.PowerShell.Tests.ps1 -Output Detailed
